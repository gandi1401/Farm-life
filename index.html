
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#294b30">
  <title>Farm Life Indonesia 2.0</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="game">
    <div class="topbar">
      <div class="brand">🌾 FARM LIFE</div>
      <div class="money">💰 Rp <span id="money">500</span></div>
    </div>

    <div class="stats">
      <span>⭐ Level <b id="level">1</b></span>
      <span>XP <b id="xp">0</b></span>
      <span>☀️ Pagi</span>
    </div>

    <div id="loading">Memuat Farm Life Indonesia 2.0...</div>
    <div id="message">Selamat datang di kebunmu!</div>

    <div class="controls">
      <div class="movement">
        <button data-dir="up">▲</button>
        <div class="middle">
          <button data-dir="left">◀</button>
          <button data-dir="down">▼</button>
          <button data-dir="right">▶</button>
        </div>
      </div>

      <div class="actions">
        <button id="plantBtn">🌱<small>Tanam</small></button>
        <button id="harvestBtn">🌾<small>Panen</small></button>
        <button id="feedBtn">🥕<small>Beri makan</small></button>
      </div>
    </div>

    <div class="footer">FARM LIFE INDONESIA • V2.0</div>
  </div>

  <script type="module" src="game.js"></script>
</body>
</html>
