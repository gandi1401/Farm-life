
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Farm Life Indonesia</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="game"></div>

  <div id="loading">🌾 Memuat dunia pertanian...</div>

  <div class="topbar">
    <div class="brand">🌾 FARM LIFE INDONESIA</div>
    <div class="stats">
      <span>🪙 <b id="money">500</b></span>
      <span>⭐ Lv. <b id="level">1</b></span>
      <span>✨ <b id="xp">0</b> XP</span>
    </div>
  </div>

  <div class="message" id="message">
    Selamat datang di pertanianmu!
  </div>

  <div class="controls">
    <div class="movement">
      <button data-dir="up">▲</button>
      <div class="middle">
        <button data-dir="left">◀</button>
        <button data-dir="down">▼</button>
        <button data-dir="right">▶</button>
      </div>
    </div>

    <div class="actions">
      <button id="plantBtn">🌱<small>Tanam</small></button>
      <button id="harvestBtn">🌾<small>Panen</small></button>
    </div>
  </div>

  <div class="help">
    Gerakkan petani dengan tombol arah atau WASD. Dekati lahan untuk menanam dan memanen.
  </div>

  <script type="module" src="game.js"></script>
</body>
</html>
